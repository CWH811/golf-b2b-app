name: CI and Deploy

on:
  push:
    branches: [ main, master, '**/wip/**', '**/feature/**', 'wip/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --silent
      - name: Lint
        run: npm run lint --silent || true
      - name: Typecheck
        run: npx tsc --noEmit || true
      - name: Run tests
        run: npm run test --silent || true
      - name: Build
        run: npm run build --silent

  deploy:
    name: Deploy to Vercel (conditional)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout with permission to push
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --silent
      - name: Build
        run: npm run build --silent
      - name: Create rollback tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG=deploy-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}
          git tag -a "$TAG" -m "Rollback tag created by CI"
          git push origin "$TAG"
      - name: Deploy to Vercel
        if: secrets.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          prod: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Skip deploy
        if: secrets.VERCEL_TOKEN == ''
        run: |
          echo "VERCEL_TOKEN not present; skipping deployment. To enable, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID as repo secrets."
